[project]
name = "sigit"
version = "0.2.1"
description = "Simple Information Gathering Toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "termuxhackers-id", email = "termuxhackers.id@gmail.com" }]
keywords = ["sigit", "osint", "username-checker", "reconnaissance", "security"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
]
dependencies = [
    "certifi>=2024.0.0",
    "curl-cffi>=0.7.0",
    "phonenumbers>=9.0.40",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "rich>=13.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sigit"]

[project.scripts]
sigit = "sigit.__main__:entrypoint"

[dependency-groups]
dev = ["pyright>=1.1.414", "pytest>=9.1.1", "ruff>=0.16.10"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["references"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
exclude = ["references"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
